<!-- VERSION: contact_indext_v0.0.10 -->
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <title>Contact | 浪遊</title>
  {% include head.html %}
  {% include sidebar.html %}
  <link rel="stylesheet" href="/assets/css/theme.css">
  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }

  
    /* CONTACT */

    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 100px 55px;
    }

    .about {
      max-width: 620px;
      margin: 0 auto;
    }

    .contact-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 55px;
    }

    .contact-title {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 5px;
      margin: 0 0 45px;
    }

    .contact-text {
      font-family: "LXGW WenKai TC", serif;
      font-size: 16px;
      line-height: 2.2;
      color: #444;
    }

    .contact-text p {
      margin: 0 0 28px;
    }

    .signature {
      font-family: "LXGW WenKai TC", serif;
      margin-top: 55px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #777;
    }


    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 28px 22px 22px;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 60px 25px 80px;
      }

      .about-title {
        font-size: 26px;
      }

      .contact-email {
        display: inline-block;
        margin-top: 15px;
      
        font-size: 11px;
        letter-spacing: 4px;
      
        color: #444;
        text-decoration: none;
      
        padding-bottom: 5px;
        border-bottom: 1px solid #999;
      }

      .contact-email:hover {
        opacity: 0.55;
      }
    }

  </style>

</head>


<body>

<div class="page">
  {% include sidebar.html %}
  
  <main class="content">

    <section class="about">

      <div class="about-label">
        CONTACT
      </div>

      <h1 class="about-title">
        寫封信給我
      </h1>

      <div class="about-text">

        <p>
        如果有一張照片、一段文字，<br>
        剛好讓你想起了什麼，
      </p>

      <p>
        歡迎寫封信給我。
      </p>

      <p>
        <a class="contact-email"
           href="mailto:artep.wandering@gmail.com">
          EMAIL →
        </a>
      </p>

      </div>

      <div class="signature">
        — Arte:p
      </div>

    </section>

  </main>

</div>

</body>
</html>
