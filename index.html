<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>浪遊 | Arte:p</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }

    /* 左側固定欄 */
    .sidebar {
      width: 280px;
      min-height: 100vh;
      padding: 68px 38px 38px;
      border-right: 1px solid #d9d9d5;
      position: fixed;
      left: 0;
      top: 0;
      background: #f7f7f5;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 54px;
    }

    .brand-title {
      font-size: 34px;
      letter-spacing: 10px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .brand-author {
      font-size: 12px;
      letter-spacing: 3px;
      color: #666;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .menu a:hover {
      color: #111;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* 右側 */
    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 70px 55px 90px;
    }

    /* 每一組雙照片 */
    .postcard-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 30px;
      margin-bottom: 80px;
      align-items: start;
    }

    .postcard-card {
      display: flex;
      flex-direction: column;
    }

    .photo {
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #dededb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta {
      margin-top: 24px;
    }

    .post-number {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 12px;
    }

    .date {
      font-size: 10px;
      letter-spacing: 2px;
      color: #999;
      margin-bottom: 16px;
    }

    .title {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.55;
      margin: 0 0 16px;
    }

    .excerpt {
      font-size: 15px;
      line-height: 1.9;
      color: #555;
      max-width: 560px;
    }

    .read-more {
      display: inline-block;
      margin-top: 18px;
      text-decoration: none;
      color: #222;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 10px 0 80px;
    }

    @media (max-width: 900px) {
      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
        padding: 28px 22px 22px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 28px 20px 60px;
      }

      .postcard-row {
        grid-template-columns: 1fr;
        gap: 55px;
        margin-bottom: 60px;
      }

      .title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-title">浪遊</div>
        <div class="brand-author">Arte:p</div>
      </div>

      <nav class="menu">
        <a href="#">HOME</a>
        <a href="#">POSTCARDS</a>
        <a href="#">JOURNAL</a>
        <a href="#">ABOUT</a>
      </nav>

      <div class="sidebar-bottom">
        Photography<br>
        Travel<br>
        Words<br><br>
        © 2026 Arte:p
      </div>

    </aside>

    <main class="content">

      <!-- 最新兩篇永遠放最前面 -->
      <section class="postcard-row">

        <!-- 最新一篇 -->
        <article class="postcard-card">

          <div class="photo">
            PHOTO #002
          </div>

          <div class="meta">
            <div class="post-number">POSTCARD #002</div>
            <div class="date">23 AUG 2026</div>

            <h2 class="title">
              第二張明信片的標題
            </h2>

            <div class="excerpt">
              這裡放第二張明信片的短文摘要。
            </div>

            <a class="read-more" href="#">
              READ →
            </a>
          </div>

        </article>

        <!-- 上一篇 -->
        <article class="postcard-card">

          <div class="photo">
            <img src="images/postcard-001.jpg" alt="Postcard #001">
          </div>

          <div class="meta">
            <div class="post-number">POSTCARD #001</div>
            <div class="date">16 AUG 2026</div>

            <h2 class="title">
              給處在動盪環境，<br>
              不知如何面對的你。
            </h2>

            <div class="excerpt">
              或許，我們控制不了環境的動盪。<br>
              但我們可以控制的，是讓自己的心像水平儀一樣，
              隨著動盪，時刻調整回平靜的位置。
            </div>

            <a class="read-more" href="#">
              READ →
            </a>
          </div>

        </article>

      </section>

      <div class="divider"></div>

    </main>

  </div>

</body>
</html>
