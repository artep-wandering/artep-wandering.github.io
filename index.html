<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>浪遊 | Arte:p</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }

    /* 左側固定欄 */
    .sidebar {
      width: 280px;
      min-height: 100vh;
      padding: 70px 40px 40px;
      border-right: 1px solid #d9d9d5;
      position: fixed;
      left: 0;
      top: 0;
      background: #f7f7f5;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 55px;
    }

    .brand-title {
      font-size: 34px;
      letter-spacing: 10px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .brand-author {
      font-size: 12px;
      letter-spacing: 3px;
      color: #666;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
      transition: 0.2s;
    }

    .menu a:hover {
      color: #111;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* 右側內容 */
    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 70px 55px 90px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 28px;
      align-items: stretch;
    }

    .photo {
      background: #dededb;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .photo.small {
      min-height: 520px;
    }

    .story {
      max-width: 680px;
      padding: 70px 0 40px;
    }

    .post-number {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 22px;
    }

    .story h1 {
      font-size: 34px;
      font-weight: 400;
      line-height: 1.55;
      margin: 0 0 28px;
    }

    .story p {
      font-size: 16px;
      line-height: 2;
      color: #555;
      margin: 0;
    }

    .read-more {
      display: inline-block;
      margin-top: 30px;
      color: #222;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 70px 0 0;
    }

    @media (max-width: 900px) {
      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 28px 22px 22px;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
      }

      .brand {
        margin-bottom: 22px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 28px 20px 60px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .photo,
      .photo.small {
        min-height: 300px;
      }

      .story {
        padding-top: 40px;
      }

      .story h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-title">浪遊</div>
        <div class="brand-author">Arte:p</div>
      </div>

      <nav class="menu">
        <a href="#">HOME</a>
        <a href="#">POSTCARDS</a>
        <a href="#">JOURNAL</a>
        <a href="#">ABOUT</a>
      </nav>

      <div class="sidebar-bottom">
        Photography<br>
        Travel<br>
        Words<br><br>
        © 2026 Arte:p
      </div>

    </aside>

    <main class="content">

      <section class="hero">
        <div class="photo">
          PHOTO 01
        </div>

        <div class="photo small">
          PHOTO 02
        </div>
      </section>

      <section class="story">

        <div class="post-number">
          POSTCARD 001
        </div>

        <h1>
          給處在動盪環境，<br>
          不知如何面對的你。
        </h1>

        <p>
          或許，我們控制不了環境的動盪。<br>
          但我們可以控制的，是讓自己的心像水平儀一樣，<br>
          隨著動盪，時刻調整回平靜的位置。
        </p>

        <a class="read-more" href="#">
          READ →
        </a>

      </section>

      <div class="divider"></div>

    </main>

  </div>

</body>
</html>
