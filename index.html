<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>浪遊 | Arte:p</title>

  <style>
    body {
      margin: 0;
      background: #f5f5f3;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 28px;
      letter-spacing: 6px;
    }

    .author {
      font-size: 14px;
      letter-spacing: 2px;
    }

    main {
      max-width: 900px;
      margin: 40px auto 100px;
      padding: 0 30px;
      text-align: center;
    }

    .photo-placeholder {
      width: 100%;
      aspect-ratio: 3 / 2;
      background: #dededb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      letter-spacing: 2px;
      margin-bottom: 55px;
    }

    .post-number {
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 27px;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .excerpt {
      max-width: 560px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 2;
      color: #555;
    }

    .read-more {
      display: inline-block;
      margin-top: 35px;
      color: #222;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 90px;
      display: flex;
      justify-content: center;
      gap: 45px;
      flex-wrap: wrap;
    }

    nav a {
      color: #444;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 2px;
    }

    footer {
      margin-top: 90px;
      padding-bottom: 40px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      header {
        padding: 28px 20px;
      }

      .brand {
        font-size: 23px;
      }

      main {
        margin-top: 20px;
        padding: 0 20px;
      }

      h1 {
        font-size: 22px;
      }

      nav {
        gap: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">浪遊</div>
    <div class="author">Arte:p</div>
  </header>

  <main>

    <div class="photo-placeholder">
      PHOTO
    </div>

    <div class="post-number">
      POSTCARD 001
    </div>

    <h1>
      給處在動盪環境，<br>
      不知如何面對的你。
    </h1>

    <div class="excerpt">
      或許，我們控制不了環境的動盪。<br>
      但我們可以控制的，是讓自己的心像水平儀一樣，<br>
      隨著動盪，時刻調整回平靜的位置。
    </div>

    <a class="read-more" href="#">
      READ →
    </a>

    <nav>
      <a href="#">POSTCARDS</a>
      <a href="#">JOURNAL</a>
      <a href="#">ABOUT</a>
    </nav>

    <footer>
      © 2026 Arte:p
    </footer>

  </main>

</body>
</html>
