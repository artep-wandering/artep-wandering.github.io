<body>

  <div class="page">
    {% include sidebar.html %}
   
<main class="content">

  <section class="postcard-row">

    {% for post in site.posts %}

      <article class="postcard-card">

        <a href="{{ post.url }}" class="photo-link">
          <!--顯示照片套用哪一張 <p>HOME IMAGE DEBUG: {{ post.image }}</p> -->
          <div class="photo">
            <img src="{{ post.image }}" alt="{{ post.title }}">
          </div>
        </a>
      </article>
      {% endfor %} 

  </section>

</main>

  </div>
