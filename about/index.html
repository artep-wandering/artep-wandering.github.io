---
layout: null
---
<!-- VERSION: about_index_v0.0.7-->
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About | 浪遊</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="icon" type="image/png" href="/images/Artep-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap"
      rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap"
      rel="stylesheet">

  <style>
    

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }


    /* LEFT SIDEBAR */

    .sidebar {
      width: 280px;
      min-height: 100vh;
      padding: 68px 38px 38px;
      border-right: 1px solid #d9d9d5;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 54px;
    }

    .brand-title {
      font-size: 34px;
      letter-spacing: 10px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .brand-author {
      font-size: 12px;
      letter-spacing: 3px;
      color: #666;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .menu a.active {
      color: #111;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      letter-spacing: 1px;
    }


    /* ABOUT */

    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 100px 55px;
    }

    .about {
      max-width: 620px;
      margin: 0 auto;
    }

    .about-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 55px;
    }

    .about-title {
      /*font-family: "LXGW WenKai TC", serif;*/
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 5px;
      margin: 0 0 45px;
    }

    .about-text {
      font-family: "LXGW WenKai TC", serif;
      font-size: 16px;
      line-height: 2.2;
      color: #444;
    }

    .about-text p {
      margin: 0 0 28px;
    }

    .signature {
      font-family: "LXGW WenKai TC", serif;
      margin-top: 55px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #777;
    }


    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 28px 22px 22px;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 60px 25px 80px;
      }

      .about-title {
        font-size: 26px;
      }
      .about-logo {
        width: 80px;
        height: auto;
        display: block;
        margin: 30px 0 35px;
      }
    }

  </style>

</head>


<body>

<div class="page">
  {% include sidebar.html %}

  <main class="content">

    <section class="about">

      <div class="about-label">
        ABOUT
      </div>
       <!-- 浪遊 Logo -->
      <img src="/images/Artep-logo.png"
           alt="浪遊 Logo"
           class="about-logo">
      
      <h1 class="about-title">
        浪遊
      </h1>

      <div class="about-text">

        <p>
          浪遊，不一定要去很遠的地方。
        </p>

        <p>
          有時候只是走在一座陌生的城市，<br>
          有時候只是停下來，看見了一個平常不會注意的畫面。
        </p>

        <p>
          我用照片留下那些經過的地方，<br>
          也用文字留下當時的自己。
        </p>

        <p>
          這裡沒有旅行攻略，<br>
          也不打算告訴你人生應該怎麼過。
        </p>

        <p>
          只是一些途中看見的風景、<br>
          一些偶然出現的念頭，<br>
          還有一些想寄給某個人的話。
        </p>

      </div>

      <div class="signature">
        — Arte:p
      </div>

    </section>

  </main>

</div>

</body>
</html>
