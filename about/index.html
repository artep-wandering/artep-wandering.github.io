<!-- VERSION: about_index_v0.0.22-->
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <title>About | 浪遊</title>
  {% include head.html %}
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">


  <style>
    

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }

    /* ABOUT */

    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 100px 55px;
    }

    .about {
      max-width: 620px;
      margin: 0 auto;
    }

    .about-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 55px;
    }

    .about-title {
      /*font-family: "LXGW WenKai TC", serif;*/
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 5px;
      margin: 0 0 45px;
    }

    .about-divider {
      width: 38px;
      height: 1px;
      background: #c9c0b5;
      margin: 0 auto 40px;
    }
    .about-text {
      font-family: "LXGW WenKai TC", serif;
      text-align: center;
      font-size: 16px;
      line-height: 2.2;
      color: #444;
    }

    .about-text p {
      margin: 0 0 28px;
    }

    .signature {
      font-family: "LXGW WenKai TC", serif;
      text-align: center;
      margin-top: 55px;
      font-size: 13px;
      letter-spacing: 3px;
      color: #777;
    }
    
    .about-logo {
      width: 400px;
      max-width: 400px;
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 28px 22px 22px;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 60px 25px 80px;
      }

      .about-title {
        font-size: 26px;
      }
      

     
    }
    
  </style>

</head>


<body>

<div class="page">
  {% include sidebar.html %}

  <main class="content">

    <section class="about">

      <div class="about-label">
        ABOUT
      </div>
       <!-- 浪遊 Logo -->
      <img src="/images/Artep-logo1.png"
           alt="浪遊 Logo"
           class="about-logo">
      
      <h1 class="about-title">
        浪遊
      </h1>

      <div class="about-text">

        <p>
          浪遊，不一定要去很遠的地方。
        </p>

        <p>
          有時候只是走在一座陌生的城市，<br>
          有時候只是停下來，看見了一個平常不會注意的畫面。
        </p>

        <p>
          我用照片留下那些經過的地方，<br>
          也用文字留下當時的自己。
        </p>

        <p>
          這裡沒有旅行攻略，<br>
          也不打算告訴你人生應該怎麼過。
        </p>

        <p>
          只是一些途中看見的風景、<br>
          一些偶然出現的念頭，<br>
          還有一些想寄給某個人的話。
        </p>

      </div>

      <div class="signature">
        — Arte:p
      </div>

    </section>

  </main>

</div>

</body>
</html>
