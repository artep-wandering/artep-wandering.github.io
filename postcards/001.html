<!-- VERSION: 001_v0.0.2-->
<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Postcard #001 | 浪遊</title>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap"
        rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap"
        rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .page {
      display: flex;
      min-height: 100vh;
    }

    /* LEFT SIDEBAR */

    .sidebar {
      width: 280px;
      min-height: 100vh;
      padding: 68px 38px 38px;
      border-right: 1px solid #d9d9d5;
      position: fixed;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
    }

    .brand {
      margin-bottom: 54px;
    }

    .brand-title {
      font-size: 34px;
      letter-spacing: 10px;
      font-weight: 400;
      margin-bottom: 12px;
    }

    .brand-author {
      font-size: 12px;
      letter-spacing: 3px;
      color: #666;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .menu a {
      text-decoration: none;
      color: #555;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .menu a:hover {
      color: #111;
    }

    .sidebar-bottom {
      margin-top: auto;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* ARTICLE */

    .content {
      margin-left: 280px;
      width: calc(100% - 280px);
      padding: 70px 55px 100px;
    }

    .article {
      max-width: 900px;
      margin: 0 auto;
    }

    .post-number {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 10px;
    }

    .date {
      font-size: 10px;
      letter-spacing: 2px;
      color: #999;
      margin-bottom: 32px;
    }

    .hero-photo {
      width: 100%;
      margin-bottom: 55px;
      background: #fdfcf8;
      padding: 22px;

      border: 1px solid #e4e1da;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);

      border-radius: 2px;
    }

    .hero-photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .writing {
      max-width: 620px;
      margin: 0 auto;
    }

    h1 {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.65;
      margin: 0 0 38px;
    }

    .text {
      font-size: 16px;
      line-height: 2.15;
      color: #444;
    }

    .signature {
      margin-top: 38px;
      text-align: right;
      font-size: 14px;
      letter-spacing: 2px;
    }
    .postcard-mark {
      margin-top: 14px;
      text-align: right;

      font-size: 10px;
      letter-spacing: 2px;

      color: #999;
    }
    /* FEEDBACK */

    .feedback {
      max-width: 620px;
      margin: 75px auto 0;
      padding-top: 30px;
      border-top: 1px solid #ddd;
    }

    .like {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
    }
    .like svg {
      width: 24px;
      height: 24px;

      fill: transparent;
      stroke: #999;
      stroke-width: 1.5;

      transition:
        fill 0.25s ease,
        stroke 0.25s ease;
    }
    
    .like.liked svg {
      fill: #e88b8b;
      stroke: #e88b8b;
    }

    .comment-intro {
      margin-top: 42px;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }

    .comment-placeholder {
      margin-top: 18px;
      border: 1px solid #ddd;
      padding: 18px;
      color: #999;
      font-size: 13px;
    }

    .navigation {
      max-width: 620px;
      margin: 70px auto 0;
      padding-top: 25px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
    }

    .navigation a {
      text-decoration: none;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .page {
        display: block;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        padding: 28px 22px 22px;
        border-right: none;
        border-bottom: 1px solid #d9d9d5;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-title {
        font-size: 27px;
      }

      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .content {
        margin-left: 0;
        width: 100%;
        padding: 35px 20px 70px;
      }

      h1 {
        font-size: 25px;
      }

      .hero-photo {
        margin-bottom: 40px;
      }
    }
  </style>

</head>
 
<body>

<div class="page">

{% include sidebar.html %}

  <main class="content">

    <article class="article">

      <div class="post-number">
        POSTCARD #001
      </div>

      <div class="date">
        16 AUG 2026
      </div>

      <div class="hero-photo">
        <img src="../images/postcard-001.jpg"
             alt="Postcard #001">
        
        <div class="postcard-mark">
              POSTCARD #001 · Arte:p
        </div>
      </div>


      <div class="writing">

        <h1>
          給處在動盪環境，<br>
          不知如何面對的你。
        </h1>

        <div class="text">

          <p>
            或許，我們控制不了環境的動盪。
          </p>

          <p>
            但，我們可以控制的是，<br>
            讓自己的心像水平儀一樣，<br>
            隨著動盪，時刻調整回平靜的位置。
          </p>

        </div>

        <div class="signature">
          — 浪遊
        </div>

      </div>


      <section class="feedback">

        <button id="likeButton" class="like" type="button" aria-label="喜歡這張明信片">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21
                     C10 19 3 14.5 3 8.5
                     C3 5.5 5.3 3.5 8 3.5
                     C9.7 3.5 11.2 4.6 12 6.8
                     C12.8 4.6 14.3 3.5 16 3.5
                     C18.7 3.5 21 5.5 21 8.5
                     C21 14.5 14 19 12 21Z"/>
          </svg>
        </button>

        <div class="comment-intro">
          如果這張明信片也讓你想起了什麼，歡迎留下一句話
        </div>

        <div class="comment-placeholder">
          COMMENT — Coming soon
        </div>

      </section>


      <nav class="navigation">

        <span></span>

        <a href="#">
          NEXT →
        </a>

      </nav>

    </article>

  </main>

</div>
  
<script>
  const likeButton = document.getElementById("likeButton");
  const storageKey = "postcard-001-liked";

  if (likeButton) {
    const liked = localStorage.getItem(storageKey) === "true";
    likeButton.classList.toggle("liked", liked);

    likeButton.addEventListener("click", function () {
      const isLiked = likeButton.classList.contains("liked");

      if (isLiked) {
        localStorage.removeItem(storageKey);
        likeButton.classList.remove("liked");
      } else {
        localStorage.setItem(storageKey, "true");
        likeButton.classList.add("liked");
      }
    });
  }
</script>
  
</body>

</html>
